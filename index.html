<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lil Stash</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Oswald", sans-serif;
    }

    :root {
      --lime: #c9ff38;
      --cyan: #55edff;
      --orange: #ff9f43;
      --yellow: #ffe45e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(85, 237, 255, .2), transparent 35%),
        radial-gradient(ellipse at 90% 25%, rgba(255, 159, 67, .16), transparent 32%),
        radial-gradient(ellipse at 50% 90%, rgba(201, 255, 56, .14), transparent 35%),
        #101018;
      background-attachment: fixed;
    }

    header {
      padding: 24px 20px 0;
      text-align: center;
    }

    h1 {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--lime);
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #397d45, 0 0 22px rgba(201, 255, 56, .4);
      animation: title-float 3s ease-in-out infinite;
    }

    .top-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #time-box {
      padding: 9px 16px;
      border: 1px solid rgba(201, 255, 56, .5);
      border-radius: 16px;
      background: rgba(25, 24, 37, .9);
      color: var(--lime);
      line-height: 1.4;
    }

    #custom-time {
      font-size: 1.05rem;
      font-weight: 700;
    }

    #custom-date {
      color: #c6c2d2;
      font-size: .85rem;
    }

    #search-form {
      display: flex;
      width: min(400px, 90vw);
      height: 46px;
      overflow: hidden;
      border: 1px solid rgba(85, 237, 255, .45);
      border-radius: 24px;
      background: #1c1a29;
    }

    #query {
      flex: 1;
      min-width: 0;
      padding: 0 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 1rem;
    }

    #query::placeholder {
      color: #aaa5bb;
    }

    #search-form button {
      width: 52px;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--lime));
      color: #11101a;
      cursor: pointer;
      font-size: 1.5rem;
    }

    .request-button-wrap {
      margin: 20px auto 0;
      text-align: center;
    }

    .vote-button {
      position: relative;
      z-index: 0;
      width: 220px;
      min-height: 50px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    .vote-button::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: -1;
      border-radius: 10px;
      background: linear-gradient(
        45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5,
        #002bff, #7a00ff, #ff00c8, #ff0000
      );
      background-size: 400%;
      filter: blur(5px);
      opacity: 0;
      animation: glowing 20s linear infinite;
      transition: opacity .3s ease-in-out;
    }

    .vote-button:hover::before,
    .vote-button:focus-visible::before {
      opacity: 1;
    }

    .vote-button::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 10px;
      background: #111;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 17px;
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px 0 40px;
    }

    .game-item {
      --card-accent: var(--lime);
      min-width: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #080b10;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .game-item:nth-child(4n + 2) { --card-accent: var(--cyan); }
    .game-item:nth-child(4n + 3) { --card-accent: var(--orange); }
    .game-item:nth-child(4n + 4) { --card-accent: var(--yellow); }

    .game-item:hover {
      transform: translateY(-4px) scale(1.025);
    }

    .game-item:focus-visible {
      outline: 2px solid var(--card-accent);
      outline-offset: 3px;
    }

    .game-item[hidden] {
      display: none;
    }

    .game-thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 3px solid var(--card-accent);
      border-radius: 12px;
      background: #101018;
    }

    .game-name {
      display: block;
      width: 100%;
      padding: 7px 5px 9px;
      color: #f5f5f5;
      text-align: center;
      font-size: 1rem;
      line-height: 1.2;
    }

    #game-viewer[hidden] {
      display: none;
    }

    #game-viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: #101018;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(1200px, 100%);
      margin: 0 auto 10px;
    }

    #viewer-title {
      margin: 0;
      color: var(--lime);
      font-size: 1.4rem;
    }

    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .viewer-actions button {
      padding: 8px 15px;
      border: 1px solid var(--cyan);
      border-radius: 8px;
      background: var(--cyan);
      color: #11101a;
      cursor: pointer;
      font-size: 1rem;
    }

    .viewer-actions button:hover {
      border-color: var(--lime);
      background: var(--lime);
    }

    #game-frame {
      flex: 1;
      width: min(1200px, 100%);
      min-height: 0;
      margin: 0 auto;
      border: 1px solid rgba(85, 237, 255, .45);
      border-radius: 10px;
      background: #000;
    }

    @keyframes title-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes glowing {
      0% { background-position: 0 0; }
      50% { background-position: 400% 0; }
      100% { background-position: 0 0; }
    }

    @media (max-width: 500px) {
      .game-grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }

      #game-viewer {
        padding: 8px;
      }

      .viewer-header {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Lil Stash</h1>

    <div class="top-tools">
      <div id="time-box">
        <span id="custom-time"></span><br>
        <span id="custom-date"></span>
      </div>

      <form id="search-form" role="search">
        <input id="query" type="search" placeholder="Search games" aria-label="Search games">
        <button type="submit" aria-label="Search">⌕</button>
      </form>
    </div>

    <div class="request-button-wrap">
      <button id="vote-button" class="vote-button" type="button">Game vote</button>
    </div>
  </header>

  <main class="game-grid" id="game-grid"></main>

  <section id="game-viewer" hidden aria-label="Game player">
    <div class="viewer-header">
      <h2 id="viewer-title">Game</h2>

      <div class="viewer-actions">
        <button id="play-fullscreen" type="button">Play Fullscreen!</button>
        <button id="schoology-button" type="button">Open Schoology</button>
        <button id="close-viewer" type="button">Close game ✕</button>
      </div>
    </div>

    <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; gamepad"></iframe>
  </section>

      document.getElementById("custom-time").textContent =
        now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        });

      document.getElementById("custom-date").textContent =
        now.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });
    }

    const grid = document.getElementById("game-grid");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("query");
    const gameViewer = document.getElementById("game-viewer");
    const gameFrame = document.getElementById("game-frame");
    const viewerTitle = document.getElementById("viewer-title");
    const fullscreenButton = document.getElementById("play-fullscreen");

    let currentGame = null;
    let fullscreenTab = null;

    function playInBox(name, url) {
      currentGame = { name, url };
      fullscreenTab = null;
      viewerTitle.textContent = name;
      gameFrame.src = url;
      fullscreenButton.textContent = "Play Fullscreen!";
      gameViewer.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function playFullscreen() {
      if (!currentGame) return;

      if (fullscreenTab && !fullscreenTab.closed) {
        fullscreenTab.focus();
        return;
      }

      const gameTab = window.open("about:blank", "_blank");

      if (!gameTab) {
        alert("Please allow pop-ups for this site.");
        return;
      }

      fullscreenTab = gameTab;
      gameTab.document.title = currentGame.name;
      gameTab.document.documentElement.style.cssText = "height:100%;margin:0";
      gameTab.document.body.style.cssText =
        "height:100vh;margin:0;overflow:hidden;background:#000";

      const frame = gameTab.document.createElement("iframe");
      frame.src = currentGame.url;
      frame.title = currentGame.name;
      frame.allow = "fullscreen; autoplay; gamepad";
      frame.style.cssText = "border:none;width:100%;height:100%;display:block";

      gameTab.document.body.appendChild(frame);
      gameTab.focus();
      fullscreenButton.textContent = "Page Opened!";
    }

    function closeGame() {
      gameFrame.src = "about:blank";
      gameViewer.hidden = true;
      document.body.style.overflow = "";
      currentGame = null;
      fullscreenTab = null;
      fullscreenButton.textContent = "Play Fullscreen!";
    }

    fullscreenButton.addEventListener("click", playFullscreen);
    document.getElementById("close-viewer").addEventListener("click", closeGame);

    document.getElementById("schoology-button").addEventListener("click", () => {
      window.open(
        "https://centennial.schoology.com/home",
        "_blank",
        "noopener,noreferrer"
      );
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !gameViewer.hidden) {
        closeGame();
      }
    });

    for (const [name, url, imageUrl] of games) {
      const card = document.createElement("article");
      card.className = "game-item";
      card.dataset.gameName = name.toLowerCase();
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `Play ${name}`);

      if (imageUrl) {
        const image = document.createElement("img");
        image.className = "game-thumbnail";
        image.src = imageUrl;
        image.alt = `${name} thumbnail`;
        image.loading = "lazy";
        card.appendChild(image);
      }

      const gameName = document.createElement("span");
      gameName.className = "game-name";
      gameName.textContent = name;
      card.appendChild(gameName);

      card.addEventListener("click", () => playInBox(name, url));

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          playInBox(name, url);
        }
      });

      grid.appendChild(card);
    }

    searchInput.addEventListener("input", () => {
      const search = searchInput.value.trim().toLowerCase();

      for (const card of grid.querySelectorAll(".game-item")) {
        card.hidden = !card.dataset.gameName.includes(search);
      }
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      const search = searchInput.value.trim().toLowerCase();
      if (!search) return;

      const match = games.find(([name]) => name.toLowerCase().includes(search));
      if (match) playInBox(match[0], match[1]);
    });

    document.getElementById("vote-button").addEventListener("click", () => {
      const voteTab = window.open("https://forms.gle/EX4ca1BmsJTZAuBd8", "_blank");
      if (voteTab) voteTab.focus();
    });
  </script>
