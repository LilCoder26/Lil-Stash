<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lil Stash</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      font-family: "Oswald", sans-serif;
    }

    :root {
      --lime: #c9ff38;
      --cyan: #55edff;
      --orange: #ff9f43;
      --yellow: #ffe45e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(85, 237, 255, 0.2), transparent 35%),
        radial-gradient(ellipse at 90% 25%, rgba(255, 159, 67, 0.16), transparent 32%),
        radial-gradient(ellipse at 50% 90%, rgba(201, 255, 56, 0.14), transparent 35%),
        #101018;
      background-attachment: fixed;
    }

    header {
      padding: 24px 20px 0;
      text-align: center;
    }

    h1 {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--lime);
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #397d45, 0 0 22px rgba(201, 255, 56, 0.4);
      animation: title-float 3s ease-in-out infinite;
    }

    .top-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #time-box {
      padding: 9px 16px;
      border: 1px solid rgba(201, 255, 56, 0.5);
      border-radius: 16px;
      background: rgba(25, 24, 37, 0.9);
      box-shadow: 0 0 18px rgba(201, 255, 56, 0.12);
      color: var(--lime);
      text-align: center;
      line-height: 1.4;
    }

    #custom-time {
      font-size: 1.05rem;
      font-weight: 700;
    }

    #custom-date {
      color: #c6c2d2;
      font-size: 0.85rem;
    }

    #search-form {
      display: flex;
      width: min(400px, 90vw);
      height: 46px;
      overflow: hidden;
      border: 1px solid rgba(85, 237, 255, 0.45);
      border-radius: 24px;
      background: #1c1a29;
      box-shadow: 0 0 18px rgba(85, 237, 255, 0.12);
    }

    #query {
      flex: 1;
      min-width: 0;
      padding: 0 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 1rem;
    }

    #query::placeholder {
      color: #aaa5bb;
    }

    #search-form:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(85, 237, 255, 0.3);
    }

    #search-form button {
      width: 52px;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--lime));
      color: #11101a;
      cursor: pointer;
      font-size: 1.5rem;
    }

    .request-button-wrap {
      margin: 20px auto 0;
      text-align: center;
    }

    .fullscreen-button {
      position: relative;
      z-index: 0;
      width: 220px;
      min-height: 50px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    .fullscreen-button::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      z-index: -1;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      border-radius: 10px;
      background: linear-gradient(
        45deg,
        #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5,
        #002bff, #7a00ff, #ff00c8, #ff0000
      );
      background-size: 400%;
      filter: blur(5px);
      opacity: 0;
      animation: glowing 20s linear infinite;
      transition: opacity 0.3s ease-in-out;
    }

    .fullscreen-button::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 10px;
      background: #111;
    }

    .fullscreen-button:hover::before,
    .fullscreen-button:focus-visible::before {
      opacity: 1;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 17px;
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px 0 40px;
    }

    .game-item {
      --card-accent: var(--lime);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background:
        radial-gradient(
          circle at 20% 15%,
          color-mix(in srgb, var(--card-accent) 25%, transparent),
          transparent 48%
        ),
        linear-gradient(145deg, #29283a, #171620 70%);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      color: #fff;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-item:nth-child(4n + 2) { --card-accent: var(--cyan); }
    .game-item:nth-child(4n + 3) { --card-accent: var(--orange); }
    .game-item:nth-child(4n + 4) { --card-accent: var(--yellow); }

    .game-item::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 280deg,
        color-mix(in srgb, var(--card-accent) 28%, transparent) 330deg,
        transparent 360deg
      );
      opacity: 0.65;
      animation: slow-spin 12s linear infinite;
      pointer-events: none;
    }

    .game-item:hover {
      transform: translateY(-4px) scale(1.025);
      border-color: var(--card-accent);
    }

    .game-name {
      position: relative;
      z-index: 1;
      padding: 12px;
      color: #fff;
      text-align: center;
      font-size: 1.3rem;
      line-height: 1.2;
      text-shadow: 0 2px 8px #000;
    }

    .game-item[hidden] {
      display: none;
    }

    .glow-on-hover {
      position: relative;
      z-index: 1;
      width: 88%;
      min-height: 40px;
      margin: 0 6% 8px;
      overflow: hidden;
      border: 1px solid var(--card-accent);
      border-radius: 9px;
      background: rgba(13, 13, 19, 0.88);
      color: var(--card-accent);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .glow-on-hover:hover,
    .glow-on-hover:focus-visible {
      background: var(--card-accent);
      color: #11101a;
      outline: none;
    }

    #game-viewer[hidden] {
      display: none;
    }

    #game-viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: rgba(8, 8, 13, 0.96);
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(1200px, 100%);
      margin: 0 auto 10px;
    }

    #viewer-title {
      margin: 0;
      color: var(--lime);
      font-size: 1.4rem;
    }

    .viewer-actions {
      display: flex;
      gap: 8px;
    }

    #play-fullscreen,
    #close-viewer {
      padding: 8px 15px;
      border: 1px solid var(--cyan);
      border-radius: 8px;
      background: #171620;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    #play-fullscreen:hover,
    #close-viewer:hover {
      background: var(--cyan);
      color: #11101a;
    }

    #game-frame {
      flex: 1;
      width: min(1200px, 100%);
      min-height: 0;
      margin: 0 auto;
      border: 1px solid rgba(85, 237, 255, 0.45);
      border-radius: 10px;
      background: #000;
    }

    @keyframes slow-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes title-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes glowing {
      0% { background-position: 0 0; }
      50% { background-position: 400% 0; }
      100% { background-position: 0 0; }
    }

    @media (max-width: 500px) {
      #game-viewer {
        padding: 8px;
      }

      #game-frame {
        border-radius: 6px;
      }

      .viewer-header {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Lil Stash</h1>

    <div class="top-tools">
      <div id="time-box">
        <span id="custom-time"></span><br>
        <span id="custom-date"></span>
      </div>

      <form id="search-form" role="search">
        <input
          id="query"
          type="search"
          placeholder="Search games"
          aria-label="Search games"
        >
        <button type="submit" aria-label="Search">⌕</button>
      </form>
    </div>

    <div class="request-button-wrap">
      <button id="vote-button" class="fullscreen-button" type="button">
        Game vote
      </button>
    </div>
  </header>

  <main class="game-grid" id="game-grid"></main>

  <section id="game-viewer" hidden aria-label="Game player">
    <div class="viewer-header">
      <h2 id="viewer-title">Game</h2>

      <div class="viewer-actions">
        <button id="play-fullscreen" type="button">Play Fullscreen!</button>
        <button id="close-viewer" type="button">Close game ✕</button>
      </div>
    </div>

    <iframe
      id="game-frame"
      title="Game"
      allow="fullscreen; autoplay; gamepad"
    ></iframe>
  </section>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("custom-time").textContent =
        now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        });

      document.getElementById("custom-date").textContent =
        now.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    const games = [
      ["Retro Bowl", "https://jamesleed119-lgtm.github.io/retro-bowl/"],
      ["Eggy Car", "https://supreme-s-alt.github.io/Eggy-car/"],
      ["Moto X3M", "https://dopdib999-svg.github.io/moto_x3m/"],
      ["DVD Logo Game", "https://aidanspeakss.github.io/dvd-logo-game/"],
      ["Escape Road 2", "https://escape-road-city-2.github.io/"],
      ["Escape Road 3", "https://giogotaura55-boop.github.io/Escape-Road-map-/"],
      ["Dri1V3ng Wild", "https://killedbyapixel.github.io/Drive13K/"],
      ["Drive mad", "https://lilcoder26.github.io/Crazy-ELA/"],
      ["Temu Flappy Bird", "https://pixel-flap.edgeone.dev/"],
      ["Geometry Dash Breeze", "https://lilcoder26.github.io/Geometry/"],
      ["Geometry Dash Lite", "https://mecanixcreations.github.io/GeometryDashLite-unity-web/"],
      ["Candy Crush", "https://brodyfong8.github.io/CandyCrush/"],
      ["Drift Boss", "https://everybodytesting.github.io/DriftBoss/"],
      ["Drift Hunters", "https://cheeset-idk.github.io/Drift-Hunters/"],
      ["Space Waves", "https://brodyfong8.github.io/Spacewaves/"],
      ["Basket Random", "https://junifer-sgs.github.io/basket-random/"],
      ["Subway Surfers", "https://martinmmcyt.github.io/subway-surfers-classic/"],
      ["Five Nights at Freddy's", "https://lilcoder26.github.io/fafn/"],
      ["FNAF 2", "https://lilcoder26.github.io/FNAF2/"],
      ["FNAF 3", "https://lilcoder26.github.io/FNAF3/"],
      ["FNAF 4", "https://lilcoder26.github.io/FNAF4/"],
      ["Survival Race", "https://gamestreeem.github.io/Survival-race/"],
      ["Level Devil", "https://taha309.github.io/LevelDevil/"],
      ["Dino game", "https://chrisdothtml.github.io/chrome-dino/"],
      ["Pac-Man", "https://masonicgit.github.io/pacman/"],
      ["BitLife", "https://lilcoder26.github.io/bitlife/"],
      ["Basketball Stars 2026", "https://brodyfong8.github.io/Basketball-Stars-2026/"],
      ["Bloxorz", "https://j3244493-jpg.github.io/Bloxors/"],
      ["Clash Royale", "https://brodyfong8.github.io/Clash-Royale-Clone-1/"],
      ["OvO", "https://lilcoder26.github.io/OVO/"],
      ["Block Blast", "https://lilcoder26.github.io/Blockblast/"],
      ["Crossy Road", "https://brodyfong8.github.io/thecrossyroad/"],
      ["Eaglercraft", "https://ninjinboys.github.io/eaglecraft/"]
      ["Brawl Stars", "https://brodyfong8.github.io/Brawl-Simulator-3D/"]
      ["Infinite Craft", "https://brodyfong8.github.io/Infinite-Craft/"]
    ];

    const grid = document.getElementById("game-grid");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("query");
    const gameViewer = document.getElementById("game-viewer");
    const gameFrame = document.getElementById("game-frame");
    const viewerTitle = document.getElementById("viewer-title");
    const fullscreenButton = document.getElementById("play-fullscreen");

    let currentGame = null;
    let fullscreenTab = null;

    function playInBox(name, url) {
      currentGame = { name, url };
      fullscreenTab = null;
      viewerTitle.textContent = name;
      gameFrame.src = url;
      fullscreenButton.textContent = "Play Fullscreen!";
      gameViewer.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function playFullscreen() {
      if (!currentGame) return;

      if (fullscreenTab && !fullscreenTab.closed) {
        fullscreenTab.focus();
        return;
      }

      const gameTab = window.open("about:blank", "_blank");

      if (!gameTab) {
        alert("Please allow pop-ups for this site.");
        return;
      }

      fullscreenTab = gameTab;

      gameTab.document.title = currentGame.name;
      gameTab.document.documentElement.style.cssText =
        "height:100%;margin:0";
      gameTab.document.body.style.cssText =
        "height:100vh;margin:0;overflow:hidden;background:#000";

      const frame = gameTab.document.createElement("iframe");
      frame.src = currentGame.url;
      frame.title = currentGame.name;
      frame.allow = "fullscreen; autoplay; gamepad";
      frame.style.cssText =
        "border:none;width:100%;height:100%;margin:0;display:block";

      gameTab.document.body.appendChild(frame);
      gameTab.focus();

      fullscreenButton.textContent = "Page Opened!";
    }

    function closeGame() {
      gameFrame.src = "about:blank";
      gameViewer.hidden = true;
      document.body.style.overflow = "";
      currentGame = null;
      fullscreenTab = null;
      fullscreenButton.textContent = "Play Fullscreen!";
    }

    fullscreenButton.addEventListener("click", playFullscreen);
    document.getElementById("close-viewer").addEventListener("click", closeGame);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !gameViewer.hidden) {
        closeGame();
      }
    });

    for (const [name, url] of games) {
      const card = document.createElement("article");
      card.className = "game-item";
      card.dataset.gameName = name.toLowerCase();

      const gameName = document.createElement("span");
      gameName.className = "game-name";
      gameName.textContent = name;

      const playButton = document.createElement("button");
      playButton.className = "glow-on-hover";
      playButton.type = "button";
      playButton.textContent = "Play";
      playButton.addEventListener("click", () => playInBox(name, url));

      card.append(gameName, playButton);
      grid.appendChild(card);
    }

    searchInput.addEventListener("input", () => {
      const search = searchInput.value.trim().toLowerCase();

      for (const card of grid.querySelectorAll(".game-item")) {
        card.hidden = !card.dataset.gameName.includes(search);
      }
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const search = searchInput.value.trim().toLowerCase();
      if (!search) return;

      const match = games.find(([name]) =>
        name.toLowerCase().includes(search)
      );

      if (match) {
        playInBox(match[0], match[1]);
      }
    });

    document.getElementById("vote-button").addEventListener("click", () => {
      const voteTab = window.open(
        "https://forms.gle/EX4ca1BmsJTZAuBd8",
        "_blank"
      );

      if (voteTab) voteTab.focus();
    });
  </script>
</body>
</html>
