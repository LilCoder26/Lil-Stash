<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lil Stash</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      font-family: "Oswald", sans-serif;
    }

    :root {
      --lime: #c9ff38;
      --cyan: #55edff;
      --orange: #ff9f43;
      --yellow: #ffe45e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #fff;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(85, 237, 255, 0.2), transparent 35%),
        radial-gradient(ellipse at 90% 25%, rgba(255, 159, 67, 0.16), transparent 32%),
        radial-gradient(ellipse at 50% 90%, rgba(201, 255, 56, 0.14), transparent 35%),
        #101018;
      background-attachment: fixed;
    }

    header {
      padding: 24px 20px 0;
      text-align: center;
    }

    h1 {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--lime);
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #397d45, 0 0 22px rgba(201, 255, 56, 0.4);
      animation: title-float 3s ease-in-out infinite;
    }

    .top-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #time-box {
      padding: 9px 16px;
      border: 1px solid rgba(201, 255, 56, 0.5);
      border-radius: 16px;
      background: rgba(25, 24, 37, 0.9);
      box-shadow: 0 0 18px rgba(201, 255, 56, 0.12);
      color: var(--lime);
      text-align: center;
      line-height: 1.4;
    }

    #custom-time {
      font-size: 1.05rem;
      font-weight: 700;
    }

    #custom-date {
      color: #c6c2d2;
      font-size: 0.85rem;
    }

    #search-form {
      display: flex;
      width: min(400px, 90vw);
      height: 46px;
      overflow: hidden;
      border: 1px solid rgba(85, 237, 255, 0.45);
      border-radius: 24px;
      background: #1c1a29;
      box-shadow: 0 0 18px rgba(85, 237, 255, 0.12);
    }

    #query {
      flex: 1;
      min-width: 0;
      padding: 0 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 1rem;
    }

    #query::placeholder {
      color: #aaa5bb;
    }

    #search-form:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(85, 237, 255, 0.3);
    }

    #search-form button {
      width: 52px;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--lime));
      color: #11101a;
      cursor: pointer;
      font-size: 1.5rem;
      transition: filter 0.2s ease;
    }

    #search-form button:hover {
      filter: brightness(1.2);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 17px;
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px 0 40px;
    }

    .game-item {
      --card-accent: var(--lime);

      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background:
        radial-gradient(
          circle at 20% 15%,
          color-mix(in srgb, var(--card-accent) 25%, transparent),
          transparent 48%
        ),
        linear-gradient(145deg, #29283a, #171620 70%);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      color: #fff;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .game-item:nth-child(4n + 2) {
      --card-accent: var(--cyan);
    }

    .game-item:nth-child(4n + 3) {
      --card-accent: var(--orange);
    }

    .game-item:nth-child(4n + 4) {
      --card-accent: var(--yellow);
    }

    .game-item::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 280deg,
        color-mix(in srgb, var(--card-accent) 28%, transparent) 330deg,
        transparent 360deg
      );
      opacity: 0.65;
      animation: slow-spin 12s linear infinite;
      pointer-events: none;
    }

    .game-item:hover,
    .game-item:focus-visible {
      z-index: 1;
      transform: translateY(-4px) scale(1.025);
      border-color: var(--card-accent);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.35),
        0 0 20px color-mix(in srgb, var(--card-accent) 30%, transparent);
      outline: none;
    }

    .game-name {
      position: relative;
      z-index: 1;
      padding: 18px 12px;
      color: #fff;
      text-align: center;
      font-size: 1.3rem;
      line-height: 1.2;
      text-shadow: 0 2px 8px #000;
    }

    .game-title {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: 48px;
      left: 0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      background: rgba(10, 10, 16, 0.92);
      color: var(--card-accent);
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .game-item:hover .game-title,
    .game-item:focus-visible .game-title {
      opacity: 1;
      transform: translateY(0);
    }

    .game-item[hidden] {
      display: none;
    }

    .glow-on-hover {
      position: relative;
      z-index: 1;
      width: 88%;
      min-height: 40px;
      margin: 0 6% 8px;
      overflow: hidden;
      border: 1px solid var(--card-accent);
      border-radius: 9px;
      background: rgba(13, 13, 19, 0.88);
      color: var(--card-accent);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .glow-on-hover:hover,
    .glow-on-hover:focus-visible {
      background: var(--card-accent);
      color: #11101a;
      outline: none;
    }

    #game-viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #0c0b12;
    }

    #game-viewer[hidden] {
      display: none;
    }

    .viewer-toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid rgba(201, 255, 56, 0.25);
      background: #171521;
      color: var(--lime);
    }

    #viewer-title {
      flex: 1;
    }

    .viewer-toolbar button {
      padding: 7px 13px;
      border: 1px solid var(--lime);
      border-radius: 7px;
      background: #211f2e;
      color: var(--lime);
      cursor: pointer;
      font-size: 1rem;
    }

    .viewer-toolbar button:hover {
      background: var(--lime);
      color: #11101a;
    }

    #game-frame {
      display: block;
      width: 100%;
      height: calc(100% - 52px);
      border: 0;
      background: #000;
    }

    @keyframes slow-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes title-float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @media (hover: none) {
      .game-title {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Lil Stash</h1>

    <div class="top-tools">
      <div id="time-box">
        <span id="custom-time"></span><br>
        <span id="custom-date"></span>
      </div>

      <form id="search-form" role="search">
        <input
          id="query"
          type="search"
          placeholder="Search games"
          aria-label="Search games"
        >
        <button type="submit" aria-label="Search">⌕</button>
      </form>
    </div>
  </header>

  <main class="game-grid" id="game-grid"></main>

  <section id="game-viewer" hidden aria-label="Game player">
    <div class="viewer-toolbar">
      <strong id="viewer-title">Game</strong>
      <button id="fullscreen-game" type="button">Fullscreen</button>
      <button id="close-game" type="button">Close</button>
    </div>

    <iframe
      id="game-frame"
      title="Selected game"
      allow="fullscreen; autoplay"
      allowfullscreen
    ></iframe>
  </section>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("custom-time").textContent =
        now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        });

      document.getElementById("custom-date").textContent =
        now.toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    const games = [
      ["Retro Bowl", "https://jamesleed119-lgtm.github.io/retro-bowl/"],
      ["Eggy Car", "https://supreme-s-alt.github.io/Eggy-car/"],
      ["Moto X3M", "https://dopdib999-svg.github.io/moto_x3m/"],
      ["DVD Logo Game", "https://aidanspeakss.github.io/dvd-logo-game/"],
      ["Escape Road City 2", "https://escape-road-city-2.github.io/"],
      ["Escape Road Map", "https://giogotaura55-boop.github.io/Escape-Road-map-/"],
      ["Dri1V3ng Wild", "https://killedbyapixel.github.io/Drive13K/"],
      ["Crazy ELA", "https://lilcoder26.github.io/Crazy-ELA/"],
      ["Temu Flappy Bird", "https://pixel-flap.edgeone.dev/"],
      ["Geometry", "https://lilcoder26.github.io/Geometry/"],
      ["Geometry Dash Lite", "https://mecanixcreations.github.io/GeometryDashLite-unity-web/"],
      ["Candy Crush", "https://brodyfong8.github.io/CandyCrush/"],
      ["Drift Boss", "https://everybodytesting.github.io/DriftBoss/"],
      ["Drift Hunters", "https://cheeset-idk.github.io/Drift-Hunters/"],
      ["Space Waves", "https://brodyfong8.github.io/Spacewaves/"],
      ["Basket Random", "https://junifer-sgs.github.io/basket-random/"],
      ["Subway Surfers Classic", "https://martinmmcyt.github.io/subway-surfers-classic/"],
      ["Five Nights at Freddy's", "https://lilcoder26.github.io/fafn/"],
      ["FNAF 2", "https://lilcoder26.github.io/FNAF2/"],
      ["FNAF 3", "https://lilcoder26.github.io/FNAF3/"],
      ["FNAF 4", "https://lilcoder26.github.io/FNAF4/"],
      ["Survival Race", "https://gamestreeem.github.io/Survival-race/"],
      ["Level Devil", "https://taha309.github.io/LevelDevil/"],
      ["Dino game", "https://chrisdothtml.github.io/chrome-dino/"],
      ["Pac-Man", "https://masonicgit.github.io/pacman/"],
      ["BitLife", "https://lilcoder26.github.io/bitlife/"],
      ["Basketball Stars 2026", "https://brodyfong8.github.io/Basketball-Stars-2026/"],
      ["Bloxorz", "https://j3244493-jpg.github.io/Bloxors/"],
      ["Clash Royale Clone", "https://brodyfong8.github.io/Clash-Royale-Clone-1/"],
      ["OvO", "https://lilcoder26.github.io/OVO/"],
      ["Block Blast", "https://lilcoder26.github.io/Blockblast/"],
      ["Crossy Road", "https://brodyfong8.github.io/thecrossyroad/"],
      ["Eaglercraft", "https://ninjinboys.github.io/eaglecraft/"]
    ];

    const grid = document.getElementById("game-grid");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("query");
    const viewer = document.getElementById("game-viewer");
    const gameFrame = document.getElementById("game-frame");
    const viewerTitle = document.getElementById("viewer-title");

    function openGameOnSite(name, url) {
      viewerTitle.textContent = name;
      gameFrame.src = url;
      viewer.hidden = false;
    }

    function openGameFullscreen(name, url) {
      const win = window.open("about:blank", "_blank");

      if (!win) {
        alert("Please allow pop-ups to open the game.");
        return;
      }

      win.document.title = name;
      win.document.body.style.cssText =
        "margin:0;width:100vw;height:100vh;overflow:hidden;background:#000";

      const iframe = win.document.createElement("iframe");
      iframe.src = url;
      iframe.title = name;
      iframe.allow = "fullscreen; autoplay";
      iframe.allowFullscreen = true;
      iframe.style.cssText =
        "border:0;width:100%;height:100%;display:block";

      win.document.body.appendChild(iframe);
    }

    for (const [name, url] of games) {
      const card = document.createElement("div");
      card.className = "game-item";
      card.tabIndex = 0;
      card.dataset.gameName = name.toLowerCase();
      card.setAttribute("aria-label", "Play " + name);

      const gameName = document.createElement("span");
      gameName.className = "game-name";
      gameName.textContent = name;

      const title = document.createElement("span");
      title.className = "game-title";
      title.textContent = name;

      const playButton = document.createElement("button");
      playButton.className = "glow-on-hover";
      playButton.type = "button";
      playButton.textContent = "Play";

      card.addEventListener("click", event => {
        if (event.target.closest(".glow-on-hover")) return;
        openGameOnSite(name, url);
      });

      card.addEventListener("keydown", event => {
        if (event.target === card && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          openGameOnSite(name, url);
        }
      });

      playButton.addEventListener("click", event => {
        event.stopPropagation();
        openGameFullscreen(name, url);
      });

      card.append(gameName, title, playButton);
      grid.appendChild(card);
    }

    searchInput.addEventListener("input", () => {
      const search = searchInput.value.trim().toLowerCase();

      for (const card of grid.querySelectorAll(".game-item")) {
        card.hidden = !card.dataset.gameName.includes(search);
      }
    });

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const search = searchInput.value.trim().toLowerCase();
      if (!search) return;

      const match = games.find(([name]) =>
        name.toLowerCase().includes(search)
      );

      if (match) {
        openGameOnSite(match[0], match[1]);
      }
    });

    document.getElementById("close-game").addEventListener("click", () => {
      gameFrame.src = "about:blank";
      viewer.hidden = true;
    });

    document.getElementById("fullscreen-game").addEventListener("click", () => {
      if (gameFrame.requestFullscreen) {
        gameFrame.requestFullscreen();
      }
    });
  </script>
</body>
</html>
